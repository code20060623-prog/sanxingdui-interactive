<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER SANXINGDUI RUNNER · 赛博三星堆跑酷</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2305060f'/><text x='50' y='72' font-size='60' text-anchor='middle' fill='%2300f0ff'>堆</text></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#05060f; --cyan:#00f0ff; --magenta:#ff2bd6; --purple:#7b2ff7;
  --yellow:#ffe600; --ink:#e8f7ff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);
  font-family:'Rajdhani',system-ui,sans-serif;color:var(--ink);user-select:none;}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;}

/* 扫描线与暗角 */
.fx-overlay{position:fixed;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.18) 2px 4px);
  mix-blend-mode:multiply;}
.fx-vignette{position:fixed;inset:0;pointer-events:none;z-index:6;
  box-shadow:inset 0 0 180px 40px rgba(0,0,0,.75);}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;
  align-items:flex-start;padding:18px 22px;pointer-events:none;opacity:0;transition:opacity .4s;}
#hud.show{opacity:1;}
.hud-box{background:rgba(8,14,30,.55);border:1px solid rgba(0,240,255,.35);border-radius:10px;
  padding:8px 16px;backdrop-filter:blur(6px);box-shadow:0 0 18px rgba(0,240,255,.15);}
.hud-label{font-size:11px;letter-spacing:2px;color:var(--cyan);opacity:.8;font-family:'Orbitron';}
.hud-val{font-size:26px;font-weight:700;font-family:'Orbitron';color:var(--ink);line-height:1.1;
  text-shadow:0 0 12px rgba(0,240,255,.7);}
#speedBox .hud-val{color:var(--yellow);text-shadow:0 0 12px rgba(255,230,0,.7);}
.hud-right{display:flex;gap:12px;}

/* 覆盖层（开始/结束） */
.overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at center,rgba(20,10,45,.55),rgba(3,4,12,.92));
  opacity:0;pointer-events:none;transition:opacity .45s;}
.overlay.show{opacity:1;pointer-events:auto;}
.title{font-family:'Orbitron';font-weight:900;font-size:clamp(30px,6vw,68px);line-height:1.05;
  letter-spacing:2px;}
.title .c1{color:var(--cyan);text-shadow:0 0 24px rgba(0,240,255,.8);}
.title .c2{color:var(--magenta);text-shadow:0 0 24px rgba(255,43,214,.8);}
.subtitle{margin-top:10px;font-size:clamp(14px,2.2vw,20px);letter-spacing:6px;color:var(--ink);opacity:.85;}
.guide{margin:26px 0;display:grid;grid-template-columns:repeat(3,minmax(90px,1fr));gap:14px;max-width:680px;}
.guide-item{background:rgba(10,18,38,.6);border:1px solid rgba(0,240,255,.3);border-radius:12px;padding:16px 12px;}
.guide-icon{font-size:30px;margin-bottom:8px;}
.guide-t{font-family:'Orbitron';font-size:13px;color:var(--cyan);letter-spacing:1px;}
.guide-d{font-size:14px;margin-top:6px;opacity:.85;line-height:1.4;}
.btn{pointer-events:cursor;cursor:pointer;font-family:'Orbitron';font-weight:700;font-size:18px;
  letter-spacing:3px;color:#04121a;background:linear-gradient(90deg,var(--cyan),#37f7ff);
  border:none;border-radius:40px;padding:16px 48px;box-shadow:0 0 30px rgba(0,240,255,.55);
  transition:transform .15s,box-shadow .15s;}
.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 44px rgba(0,240,255,.8);}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid rgba(232,247,255,.4);box-shadow:none;
  margin-top:14px;font-size:14px;padding:10px 30px;}
.final-score{font-family:'Orbitron';font-size:clamp(48px,10vw,96px);color:var(--yellow);
  text-shadow:0 0 30px rgba(255,230,0,.7);margin:8px 0 2px;}
.final-best{font-size:18px;letter-spacing:2px;color:var(--cyan);margin-bottom:18px;}

/* 摄像头与手势状态 */
#camWrap{position:fixed;right:18px;bottom:18px;z-index:11;width:150px;height:112px;border-radius:12px;
  overflow:hidden;border:1px solid rgba(0,240,255,.4);background:#000;box-shadow:0 0 18px rgba(0,240,255,.2);
  opacity:0;transition:opacity .4s;}
#camWrap.show{opacity:1;}
#cam{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
#gestureTag{position:absolute;left:0;right:0;bottom:0;font-family:'Orbitron';font-size:11px;
  text-align:center;background:rgba(0,10,20,.7);padding:4px;letter-spacing:1px;color:var(--cyan);}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:30;
  background:rgba(8,14,30,.85);border:1px solid var(--magenta);border-radius:10px;padding:12px 22px;
  font-size:16px;letter-spacing:1px;opacity:0;transition:opacity .3s;pointer-events:none;}
#toast.show{opacity:1;}
@media(max-width:600px){
  .guide{grid-template-columns:1fr;max-width:320px;}
  #camWrap{width:104px;height:78px;}
  .hud-val{font-size:20px;}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="fx-overlay"></div>
<div class="fx-vignette"></div>

<!-- HUD -->
<div id="hud">
  <div class="hud-box">
    <div class="hud-label">SCORE</div>
    <div class="hud-val" id="scoreVal">0</div>
  </div>
  <div class="hud-right">
    <div class="hud-box" id="speedBox">
      <div class="hud-label">SPEED</div>
      <div class="hud-val" id="speedVal">1.0x</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">DIST</div>
      <div class="hud-val" id="distVal">0m</div>
    </div>
  </div>
</div>

<!-- 开始界面 -->
<div class="overlay show" id="startScreen">
  <div class="title"><span class="c1">CYBER</span> <span class="c2">SANXINGDUI</span><br>RUNNER</div>
  <div class="subtitle">赛博三星堆 · 手势跑酷</div>
  <div class="guide">
    <div class="guide-item">
      <div class="guide-icon"><svg viewBox="0 0 48 48" width="38" height="38" fill="none" stroke="#00f0ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 38V12"/><path d="M12 23l12-12 12 12"/></svg></div>
      <div class="guide-t">抬手</div>
      <div class="guide-d">手向上抬，角色跳跃越过障碍</div>
    </div>
    <div class="guide-item">
      <div class="guide-icon"><svg viewBox="0 0 48 48" width="38" height="38" fill="none" stroke="#ff2bd6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 10v26"/><path d="M12 25l12 12 12-12"/></svg></div>
      <div class="guide-t">压手</div>
      <div class="guide-d">手向下压，角色滑行穿过悬门</div>
    </div>
    <div class="guide-item">
      <div class="guide-icon"><svg viewBox="0 0 48 48" width="38" height="38" fill="none" stroke="#ffe600" stroke-width="2.6" stroke-linecap="round"><path d="M10 16h14"/><path d="M10 24h24"/><path d="M10 32h32"/></svg></div>
      <div class="guide-t">快慢</div>
      <div class="guide-d">手移动越快，角色跑得越快</div>
    </div>
  </div>
  <button class="btn" id="startBtn">START</button>
  <button class="btn ghost" id="camBtn">开启摄像头手势控制</button>
</div>

<!-- 结束界面 -->
<div class="overlay" id="endScreen">
  <div class="subtitle" style="margin-bottom:4px;">SIGNAL LOST</div>
  <div class="final-score" id="finalScore">0</div>
  <div class="final-best" id="finalBest">BEST 0</div>
  <button class="btn" id="retryBtn">RUN AGAIN</button>
  <button class="btn ghost" id="homeBtn">返回首页</button>
</div>

<!-- 摄像头 -->
<div id="camWrap">
  <video id="cam" autoplay muted playsinline></video>
  <div id="gestureTag">RUN</div>
</div>
<div id="toast"></div>

  hero.baseY = GROUND_Y;
  if (hero.onGround && !hero.sliding) hero.y = hero.baseY;
}
const GRAV = 2400, JUMP_V = -880;
function jump(){
  if (hero.onGround && !hero.sliding){
    hero.vy = JUMP_V; hero.onGround = false;
    burst(hero.x + hero.w*0.3, hero.y, 12, '#00f0ff');
  }
}
function startSlide(){
  if (hero.onGround && !hero.sliding){
    hero.sliding = true; hero.slideT = 0.62;
  }
}
function endSlide(){ hero.sliding = false; }

// ===== 粒子 =====
function burst(x, y, n, color){
  for (let i = 0; i < n; i++){
    G.parts.push({
      x, y, vx: (Math.random()-.5)*260, vy: (Math.random()-.8)*260,
      life: .4 + Math.random()*.4, t:0, color, r: 1.5+Math.random()*2.5
    });
  }
}

// ===== 障碍物 =====
// type: low(跳过) high(滑行) gap(坑)
function spawnObstacle(){
  const r = Math.random();
  let type;
  if (r < 0.42) type = 'low';
  else if (r < 0.78) type = 'high';
  else type = 'gap';
  const x = W + 80;
  if (type === 'low'){
    const h = 46 + Math.random()*58;
    G.obstacles.push({type, x, w: 34+Math.random()*26, h, color: Math.random()<.5?'#00f0ff':'#ff2bd6'});
  } else if (type === 'high'){
    // 横梁底部离地：高于滑行高度、低于站立高度
    const gap = hero.h * (0.54 + Math.random()*0.14);
    G.obstacles.push({type, x, w: 46+Math.random()*30, h: 44+Math.random()*28, gap,
      color: Math.random()<.5?'#ff2bd6':'#7b2ff7'});
  } else {
    G.obstacles.push({type, x, w: 90+Math.random()*70, h: 0});
  }
}

// ===== 远景建筑（视差） =====
function initBuildings(){
  G.buildings = [];
  let x = 0;
  while (x < W * 2){
    const bw = 60 + Math.random()*110;
    const bh = 90 + Math.random()*230;
    G.buildings.push({x, w:bw, h:bh, layer: Math.random()<.5?0:1,
      hue: Math.random()<.5?'#13204a':'#1a1040'});
    x += bw + 14 + Math.random()*40;
  }
}

// ===== 背景绘制 =====
function drawBackground(dt){
  // 天空渐变
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0a0620'); sky.addColorStop(.55,'#0b0a2e'); sky.addColorStop(1,'#120826');
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);

  // 月亮/能量球
  const mx = W*0.78, my = H*0.22, mr = H*0.07;
  const mg = ctx.createRadialGradient(mx,my,mr*.2,mx,my,mr*2.2);
  mg.addColorStop(0,'rgba(255,43,214,.5)'); mg.addColorStop(1,'rgba(255,43,214,0)');
  ctx.fillStyle = mg; ctx.fillRect(mx-mr*2.2,my-mr*2.2,mr*4.4,mr*4.4);
  ctx.fillStyle='#ffd6f7'; ctx.beginPath(); ctx.arc(mx,my,mr,0,7); ctx.fill();
  ctx.fillStyle='#0a0620';
  ctx.beginPath(); ctx.arc(mx-mr*.35,my,mr*.85,0,7); ctx.fill();

  // 星星
  ctx.fillStyle='rgba(200,230,255,.8)';
  for (let i=0;i<40;i++){
    const sx = (i*97.3 - G.farOff*0.15) % W;
    const x = (sx+W)%W, y = (i*53.7)%(H*.5);
    const tw = .4+.6*Math.abs(Math.sin(G.time*2+i));
    ctx.globalAlpha = tw*.7; ctx.fillRect(x,y,1.6,1.6);
  }
  ctx.globalAlpha=1;

  // 远景建筑（视差，慢）
  const speed = G.speed;
  G.farOff += speed*dt*0.18;
  G.midOff += speed*dt*0.42;
  drawBuildings(G.farOff, .5, '#0d1838', H*.55);
  drawBuildings(G.midOff, 1, '#140f33', H*.68);

  // 地面
  drawGround(dt);
}
function drawBuildings(off, scale, baseColor, topBase){
  const span = W*2;
  ctx.fillStyle = baseColor;
  for (const b of G.buildings){
    let x = (b.x - off) % span; if (x<0) x+=span;
    if (x > W + b.w) continue;
    const bh = b.h*scale, by = GROUND_Y - bh;
    ctx.fillStyle = baseColor;
    ctx.fillRect(x, by, b.w, bh);
    // 霓虹窗户
    ctx.fillStyle = 'rgba(0,240,255,.55)';
    for (let wy = by+10; wy < GROUND_Y-12; wy += 18){
      for (let wx = x+8; wx < x+b.w-8; wx += 16){
        if (((wx*wy)%7) < 4) ctx.fillRect(wx, wy, 6, 8);
      }
    }
    // 顶部天线
    ctx.strokeStyle = 'rgba(255,43,214,.6)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(x+b.w/2, by); ctx.lineTo(x+b.w/2, by-16*scale); ctx.stroke();
    ctx.fillStyle='rgba(255,43,214,.8)'; ctx.fillRect(x+b.w/2-2, by-18*scale,4,4);
  }
}
function drawGround(dt){
  G.groundOff += G.speed*dt;
  // 地面实体
  const gg = ctx.createLinearGradient(0,GROUND_Y,0,H);
  gg.addColorStop(0,'#0a0f24'); gg.addColorStop(1,'#05060f');
  ctx.fillStyle = gg; ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);
  // 地面霓虹线
  ctx.strokeStyle='#00f0ff'; ctx.lineWidth=2;
  ctx.shadowColor='#00f0ff'; ctx.shadowBlur=14;
  ctx.beginPath(); ctx.moveTo(0,GROUND_Y); ctx.lineTo(W,GROUND_Y); ctx.stroke();
  ctx.shadowBlur=0;
  // 透视网格（横向线随速度滚动）
  ctx.strokeStyle='rgba(0,240,255,.35)'; ctx.lineWidth=1;
  const cell = 46;
  const off = G.groundOff % cell;
  for (let i=0;i<10;i++){
    const p = i/10;
    const y = GROUND_Y + p*p*(H-GROUND_Y);
    ctx.globalAlpha = .5*(1-p)+.08;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
  ctx.globalAlpha=1;
  // 纵向透视线
  for (let i=-6;i<=6;i++){
    ctx.beginPath();
    ctx.moveTo(W/2 + i*40, GROUND_Y);
    ctx.lineTo(W/2 + i*220, H);
    ctx.strokeStyle='rgba(0,240,255,.22)'; ctx.stroke();
  }
}

// ===== 障碍物绘制 =====
function drawObstacles(){
  for (const o of G.obstacles){
    if (o.type === 'gap'){
      // 坑：黑色缺口 + 发光边缘
      ctx.fillStyle='#000';
      ctx.fillRect(o.x, GROUND_Y, o.w, H-GROUND_Y);
      ctx.strokeStyle='#ff2bd6'; ctx.lineWidth=2;
      ctx.shadowColor='#ff2bd6'; ctx.shadowBlur=12;
      ctx.beginPath(); ctx.moveTo(o.x,GROUND_Y); ctx.lineTo(o.x,H);
      ctx.moveTo(o.x+o.w,GROUND_Y); ctx.lineTo(o.x+o.w,H); ctx.stroke();
      ctx.shadowBlur=0;
    } else if (o.type === 'low'){
      const y = GROUND_Y - o.h;
      ctx.fillStyle='rgba(8,12,30,.9)';
      ctx.fillRect(o.x, y, o.w, o.h);
      ctx.strokeStyle=o.color; ctx.lineWidth=2;
      ctx.shadowColor=o.color; ctx.shadowBlur=14;
      ctx.strokeRect(o.x, y, o.w, o.h);
      ctx.shadowBlur=0;
      // 内部能量纹
      ctx.strokeStyle=o.color; ctx.globalAlpha=.5;
      for (let ly=y+10; ly<GROUND_Y-6; ly+=14){
        ctx.beginPath(); ctx.moveTo(o.x+4,ly); ctx.lineTo(o.x+o.w-4,ly); ctx.stroke();
      }
      ctx.globalAlpha=1;
    } else if (o.type === 'high'){
      // 悬空横梁（滑行穿过、站立撞到）
      const edgeY = GROUND_Y - o.gap;
      ctx.fillStyle='rgba(8,12,30,.92)';
      ctx.fillRect(o.x, 0, o.w, edgeY);
      // 横梁底部发光危险面
      ctx.fillStyle=o.color;
      ctx.shadowColor=o.color; ctx.shadowBlur=16;
      ctx.fillRect(o.x, edgeY-6, o.w, 6);
      ctx.shadowBlur=0;
      ctx.strokeStyle=o.color; ctx.lineWidth=1.5; ctx.globalAlpha=.5;
      for (let yy=14; yy<edgeY-10; yy+=22){
        ctx.beginPath(); ctx.moveTo(o.x+5,yy); ctx.lineTo(o.x+o.w-5,yy); ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
  }
}

// ===== 角色绘制 =====
function drawHero(){
  ctx.save();
  let drawH = hero.h, drawW = hero.w;
  let drawY = hero.y;
  if (hero.sliding){
    // 滑行：压扁
    drawH = hero.h * 0.5; drawW = hero.w * 1.18;
    drawY = GROUND_Y;
  }
  // 跑动颠簸（仅地面）
  let bob = 0;
  if (hero.onGround && !hero.sliding){
    bob = Math.abs(Math.sin(hero.runPhase))*6;
  }
  const drawX = hero.x;
  const topY = drawY - drawH + bob;
  // 角色（screen 混合：纯黑底融入背景，亮部与霓虹发光）
  ctx.globalCompositeOperation = 'screen';
  ctx.drawImage(heroImg, drawX, topY, drawW, drawH);
  ctx.globalCompositeOperation = 'source-over';
  // 脚下速度线/拖影
  if (hero.onGround){
    ctx.strokeStyle='rgba(0,240,255,.5)'; ctx.lineWidth=2;
    for (let i=0;i<3;i++){
      const ly = GROUND_Y - 4 - i*7;
      const len = 20 + G.speedMul*16 + Math.random()*10;
      ctx.globalAlpha = .5-i*.13;
      ctx.beginPath(); ctx.moveTo(drawX-6-i*10,ly); ctx.lineTo(drawX-6-i*10-len,ly); ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

// ===== 粒子绘制 =====
function drawParts(){
  for (const p of G.parts){
    const a = 1-p.t/p.life;
    ctx.globalAlpha = a; ctx.fillStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0;
}

// ===== 碰撞盒子 =====
function heroBox(){
  if (hero.sliding){
    return {l:hero.x+hero.w*0.10, r:hero.x+hero.w*1.06,
            t:GROUND_Y-hero.h*0.5, b:GROUND_Y};
  }
  return {l:hero.x+hero.w*0.16, r:hero.x+hero.w*0.92,
          t:hero.y-hero.h+hero.h*0.05, b:hero.y};
}
function obstacleBox(o){
  if (o.type==='low') return {l:o.x+2, r:o.x+o.w-2, t:GROUND_Y-o.h, b:GROUND_Y};
  if (o.type==='high') return {l:o.x+2, r:o.x+o.w-2, t:0, b:GROUND_Y-o.gap};
  return null;
}
function overlap(a,b){ return a.l<b.r && a.r>b.l && a.t<b.b && a.b>b.t; }

// ===== 更新 =====
function update(dt){
  G.time += dt;
  if (state !== SM.RUN){
    // 菜单/结束：背景缓慢滚动，角色原地跑
    G.speed = G.baseSpeed*0.45;
    hero.runPhase += dt*G.speed*1.4;
    for (const p of G.parts){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=500*dt; }
    G.parts = G.parts.filter(p=>p.t<p.life);
    return;
  }
  // 无手势时速度随时间缓慢递增；手势时由手势平滑设定
  if (!gesture.active) G.speedMul = Math.min(2.2, G.speedMul + dt*0.022);
  G.speed = G.baseSpeed * G.speedMul;

  // 角色物理
  if (!hero.onGround){
    hero.vy += GRAV*dt;
    hero.y += hero.vy*dt;
    if (hero.y >= hero.baseY){ hero.y=hero.baseY; hero.vy=0; hero.onGround=true; }
  }
  if (hero.sliding){
    hero.slideT -= dt;
    if (hero.slideT<=0) endSlide();
  }
  hero.runPhase += dt*G.speed*1.4;

  // 障碍移动与生成
  for (const o of G.obstacles) o.x -= G.speed*dt;
  G.obstacles = G.obstacles.filter(o => o.x+o.w > -60);
  G.nextSpawn -= G.speed*dt;
  if (G.nextSpawn <= 0){
    spawnObstacle();
    G.nextSpawn = 360 + Math.random()*420 + G.speed*20;
  }

  // 碰撞
  const hb = heroBox();
  for (const o of G.obstacles){
    if (o.type==='gap'){
      if (hb.b >= GROUND_Y-2 && hb.r > o.x+8 && hb.l < o.x+o.w-8) return gameOver();
    } else if (overlap(hb, obstacleBox(o))) return gameOver();
  }

  // 粒子
  for (const p of G.parts){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=500*dt; }
  G.parts = G.parts.filter(p=>p.t<p.life);

  // 计分
  G.distance += G.speed*dt*0.6;
  G.score = Math.floor(G.distance*2);
  if (G.shake>0) G.shake = Math.max(0, G.shake-dt*3);

  scoreEl.textContent = G.score;
  speedEl.textContent = G.speedMul.toFixed(1)+'x';
  distEl.textContent = Math.floor(G.distance)+'m';
}

// ===== 主循环 =====
let last = performance.now();
function loop(now){
  const dt = Math.min(0.033, (now-last)/1000);
  last = now;
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if (G.shake>0) ctx.translate((Math.random()-.5)*G.shake*16,(Math.random()-.5)*G.shake*16);
  drawBackground(dt);
  drawObstacles();
  drawHero();
  drawParts();
  ctx.restore();
  update(dt);
  requestAnimationFrame(loop);
}

// ===== 流程控制 =====
const scoreEl=document.getElementById('scoreVal');
const speedEl=document.getElementById('speedVal');
const distEl=document.getElementById('distVal');
const hud=document.getElementById('hud');
const startScreen=document.getElementById('startScreen');
const endScreen=document.getElementById('endScreen');
const finalScore=document.getElementById('finalScore');
const finalBest=document.getElementById('finalBest');
const toastEl=document.getElementById('toast');

function startGame(){
  G.obstacles=[]; G.parts=[];
  G.distance=0; G.score=0; G.speedMul=1; G.nextSpawn=620; G.shake=0;
  hero.y=hero.baseY; hero.vy=0; hero.onGround=true; hero.sliding=false; hero.slideT=0;
  state=SM.RUN;
  startScreen.classList.remove('show');
  endScreen.classList.remove('show');
  hud.classList.add('show');
}
function gameOver(){
  if (state!==SM.RUN) return;
  state=SM.OVER; G.shake=1;
  burst(hero.x+hero.w*.5, hero.y-hero.h*.5, 28, '#ff2bd6');
  if (G.score>G.best){ G.best=G.score; localStorage.setItem('cyberSXD_best',G.best); }
  setTimeout(()=>{
    finalScore.textContent=G.score;
    finalBest.textContent='BEST '+G.best;
    endScreen.classList.add('show');
    hud.classList.remove('show');
  }, 520);
}
function goHome(){
  state=SM.MENU;
  endScreen.classList.remove('show');
  hud.classList.remove('show');
  startScreen.classList.add('show');
}
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>toastEl.classList.remove('show'),2400);
}

document.getElementById('startBtn').onclick=startGame;
document.getElementById('retryBtn').onclick=startGame;
document.getElementById('homeBtn').onclick=goHome;
document.getElementById('camBtn').onclick=enableCamera;

// ===== 键盘输入 =====
window.addEventListener('keydown', e=>{
  if (e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){
    e.preventDefault();
    if (state===SM.MENU) startGame();
    else if (state===SM.OVER) startGame();
    else jump();
  }
  if (e.code==='ArrowDown'||e.code==='KeyS'){ e.preventDefault(); startSlide(); }
});
window.addEventListener('keyup', e=>{
  if (e.code==='ArrowDown'||e.code==='KeyS') endSlide();
});

// ===== 鼠标/触摸输入 =====
function pointerDown(e){
  if (state!==SM.RUN) return;
  if (e.target.closest && e.target.closest('.overlay')) return;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  if (y < H*0.55) jump(); else startSlide();
}
function pointerUp(){ endSlide(); }
canvas.addEventListener('mousedown', pointerDown);
window.addEventListener('mouseup', pointerUp);
canvas.addEventListener('touchstart', pointerDown, {passive:true});
window.addEventListener('touchend', pointerUp);

// ===== 摄像头手势（MediaPipe Hands） =====
const cam=document.getElementById('cam');
const camWrap=document.getElementById('camWrap');
const gestureTag=document.getElementById('gestureTag');
const gesture = {active:false, x:.5, y:.5, velSmooth:0, jumpHeld:false};
let hands=null, pumping=false;
function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej;
    document.head.appendChild(s);
  });
}
async function enableCamera(){
  if (!window.isSecureContext){
    toast('摄像头需在 https 或 localhost 下使用，当前可用鼠标/触摸/键盘操作');
    return;
  }
  try{
    if (!hands){
      await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js');
      hands = new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`});
      hands.setOptions({maxNumHands:1, modelComplexity:1, minDetectionConfidence:.6, minTrackingConfidence:.5});
      hands.onResults(onHand);
    }
    const stream = await navigator.mediaDevices.getUserMedia({video:{width:640,height:480}});
    cam.srcObject = stream;
    camWrap.classList.add('show');
    gesture.active = true;
    if (!pumping) pumpHands();
    toast('手势已开启：抬手跳、压手滑、挥动越快跑得越快');
  }catch(e){
    toast('无法开启摄像头：'+(e.message||e)+'，可用鼠标/触摸操作');
  }
}
async function pumpHands(){
  pumping = true;
  while (gesture.active){
    if (cam.readyState >= 2){
      try{ await hands.send({image:cam}); }catch(e){}
    }
    await new Promise(r=>setTimeout(r,32));
  }
  pumping = false;
}
function onHand(results){
  if (!results.multiHandLandmarks || !results.multiHandLandmarks.length){
    gestureTag.textContent='NO HAND';
    gesture.velSmooth *= .9;
    return;
  }
  const lm = results.multiHandLandmarks[0];
  const wrist = lm[0];
  const nx = 1 - wrist.x;       // 镜像
  const ny = wrist.y;
  const dx = nx-gesture.x, dy = ny-gesture.y;
  const v = Math.sqrt(dx*dx+dy*dy);
  gesture.velSmooth = gesture.velSmooth*.7 + v*.3;
  gesture.x=nx; gesture.y=ny;

  // 快慢 → 速度（静止维持基础，挥动加速）
  if (state===SM.RUN){
    const target = 1 + Math.min(1.3, gesture.velSmooth*9);
    G.speedMul += (target-G.speedMul)*.2;
  }
  // 高低 → 跳/滑
  if (state===SM.RUN){
    if (ny < 0.33){
      if (!gesture.jumpHeld){ jump(); gesture.jumpHeld=true; }
      gestureTag.textContent='JUMP';
    } else if (ny > 0.62){
      startSlide(); gestureTag.textContent='SLIDE';
    } else {
      gesture.jumpHeld=false; endSlide(); gestureTag.textContent='RUN';
    }
  }
}

// ===== 启动 =====
resize();
initBuildings();
heroImg.onload = layoutHero;
requestAnimationFrame(loop);


</script>
